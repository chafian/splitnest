name: Bug report
description: Something in SplitNest does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do **not** paste API keys, tokens, passwords or private terminal output; remove anything sensitive first.
        Security problems: report them privately instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: SplitNest version
      description: Settings → About shows it.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (SplitNest-win32-x64-Setup.exe)
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Settings → System → About, or run `winver`."
      placeholder: "Windows 11 24H2 (build 26100)"
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell in the affected terminal
      multiple: true
      options:
        - Windows PowerShell 5.1
        - PowerShell 7 (pwsh)
        - WSL
        - Other / not terminal-related
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved (if any)
      multiple: true
      options:
        - None
        - Claude Code
        - Codex CLI
        - Gemini CLI
        - Other agent (say which below)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace …
        2. Split the pane …
        3. …
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: 'The log is at `%APPDATA%\SplitNest\logs\splitnest.log`. It records start-up, errors and lifecycle events, not what you type or terminal output, but please look through it before pasting.'
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
