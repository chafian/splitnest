name: CI

on:
  push:
    branches: [main, 'feat/**']
    paths-ignore: ['website/**']
  pull_request:
    paths-ignore: ['website/**']
  workflow_dispatch:
  # The release workflow runs this exact suite before building a release.
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Lint, typecheck, tests, package (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Real PowerShell PTY tests
        run: npm run test:pty
      - name: WSL tests (skipped on hosted runners without a distribution)
        run: npm run test:wsl
      - name: Package
        run: npm run package
      - name: Verify packaged build (native files + headless self-test)
        run: npm run verify:package
      - name: End-to-end UI test against the built app
        run: node tests/e2e/run-e2e.mjs --screenshots e2e-screenshots
      - name: Upload screenshots (workflow artifact, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          retention-days: 7
          if-no-files-found: ignore
